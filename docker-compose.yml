services:
  backend:
    build:
      context: ./backend
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.14.1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATA_DIR: ${DATA_DIR:-/data}
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/models}
      IMAGE_MODEL: ${IMAGE_MODEL:-clip-ViT-B-32}
      TEXT_MODEL: ${TEXT_MODEL:-sentence-transformers/clip-ViT-B-32-multilingual-v1}
      FACE_MODEL_PATH: ${FACE_MODEL_PATH:-/models/face_detection_yunet_2023mar.onnx}
      FACE_BLUR_ENABLED: ${FACE_BLUR_ENABLED:-true}
      FACE_SCORE_THRESHOLD: ${FACE_SCORE_THRESHOLD:-0.6}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      MAX_IMAGE_SIDE: ${MAX_IMAGE_SIDE:-1024}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-4}
      MATCH_HIGH: ${MATCH_HIGH:-0.315}
      MATCH_MEDIUM: ${MATCH_MEDIUM:-0.255}
      MATCH_IMAGE_MEDIUM: ${MATCH_IMAGE_MEDIUM:-0.80}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Çalışma zamanında bulut/ağ erişimi olmasın; .env bunu ezemez.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - app_data:/data
    # 1 MB üstü yüklemelerin geçici kopyası kalıcı diske yazılmasın (KVKK).
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
